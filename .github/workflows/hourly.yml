# Every hour: fetch the Brussels weather and air quality, save data/latest.json.
# On the main branch the new file is committed, which makes Vercel republish the site.
# On any other branch it is only a test run: the result is printed, nothing is saved.

name: Hourly data

on:
  schedule:
    - cron: "20 * * * *"   # 20 minutes past every hour (UTC), once IRCEL has published the hourly mean
  workflow_dispatch:         # "Run workflow" button on GitHub
  push:
    paths:
      - "scripts/fetch-data.mjs"
      - "config.js"
      - ".github/workflows/hourly.yml"

permissions:
  contents: write

concurrency:
  group: hourly-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Take the newest version of the branch, not the one from when the run was queued.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch weather and air quality
        run: node scripts/fetch-data.mjs

      - name: Save the new data (main branch only)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "fontcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep our fresh file aside, catch up with any newer commit, then save it.
          # Our data is always the newest, so it simply replaces the file. Tries 3 times.
          cp data/latest.json "$RUNNER_TEMP/latest.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/latest.json" data/latest.json
            git add data/latest.json
            if git diff --cached --quiet; then
              echo "No change."
              exit 0
            fi
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "Could not save the data after 3 attempts."
          exit 1
