# Every day at noon (Brussels time): freeze the poster into archive/YYYY/.
# GitHub's clock is UTC and its scheduled runs are often hours late or skipped,
# so it starts every hour from 10:30 to 22:30 UTC; the first run at or after
# noon in Brussels archives the day, the later ones find it done and stop.
# On any other branch it is a test run: it forces a snapshot, nothing is saved,
# and the PNG can be downloaded from the run page ("Artifacts").

name: Daily archive

on:
  schedule:
    - cron: "30 10-22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Archive now, even if it is not noon (overwrites today)"
        type: boolean
        default: false
  push:
    paths:
      - "scripts/snapshot.mjs"
      - ".github/workflows/daily-archive.yml"

permissions:
  contents: write

concurrency:
  group: fontcast-commit   # shared with the hourly job, so they never save at the same time
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # Today already archived (or still morning in Brussels)? Then stop here,
      # without fetching or saving anything.
      - name: Anything to do?
        id: todo
        run: |
          day=$(TZ=Europe/Brussels date +%F); hour=$(TZ=Europe/Brussels date +%-H)
          if [ "${{ github.ref }}" != "refs/heads/main" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ -f "archive/${day:0:4}/$day.svg" ]; then
            echo "$day is already archived."; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 12 ]; then
            echo "It is ${hour}h in Brussels, before noon."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.todo.outputs.go == 'true'
        with:
          node-version: 22

      - name: Install the PNG converter
        if: steps.todo.outputs.go == 'true'
        run: npm ci

      - name: Fresh data
        if: steps.todo.outputs.go == 'true'
        run: node scripts/fetch-data.mjs

      - name: Snapshot
        if: steps.todo.outputs.go == 'true'
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ] || [ "${{ inputs.force }}" = "true" ]; then
            node scripts/snapshot.mjs --force
          else
            node scripts/snapshot.mjs
          fi

      - name: Keep the test PNG (branches only)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-poster
          path: archive/

      - name: Save (main branch only)
        if: github.ref == 'refs/heads/main' && steps.todo.outputs.go == 'true'
        run: |
          git config user.name "fontcast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep our new files aside, catch up with any newer commit, then save them.
          mkdir -p "$RUNNER_TEMP/out"
          cp -r data "$RUNNER_TEMP/out/"
          [ -d archive ] && cp -r archive "$RUNNER_TEMP/out/"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp -r "$RUNNER_TEMP/out/." .
            git add data archive 2>/dev/null || git add data
            if git diff --cached --quiet; then
              echo "Nothing new."
              exit 0
            fi
            git commit -m "archive: $(TZ=Europe/Brussels date +'%Y-%m-%d')"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          echo "Could not save after 3 attempts."
          exit 1
